<title>Waiting list | View Spa</title>
<style>body{font-family:Arial,Helvetica,sans-serif;background:#faf7f2;color:#1E1E1E;margin:0;padding:40px 20px;text-align:center}a{color:#8A6D1F}</style>
</head>
<body>
<p>Opening&hellip;</p>
<noscript><p><a id="go" href="#">Continue</a></p></noscript>
<script>
// Ссылка из письма живёт на домене студии и перебрасывает на воркер,
// где лежит страница «выйти из листа ожидания». Сама ссылка ничего не меняет.
(function () {
  var base = 'https://viewspa-booking.ivanseydametov.workers.dev';
  var target = base + '/api/waitlist-leave' + location.search;
  var a = document.getElementById('go');
  if (a) a.href = target;
  location.replace(target);
})();
</script>
</body>
